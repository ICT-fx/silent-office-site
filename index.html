<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowera | Automatisation, IA & solutions sur-mesure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@200;300;400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Manrope', sans-serif;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .text-gradient {
            background: linear-gradient(135deg, #262626 0%, #025928 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #F2F1DF;
        }

        ::-webkit-scrollbar-thumb {
            background: #E0E0E0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #027333;
        }

        /* Garde anti-flash : fond noir avant que le preloader React ne prenne le relais */
        html.preloading,
        html.preloading body {
            background: #050505 !important;
        }
    </style>
    <script>
        // Pose le fond noir dès le parsing du HTML si le preloader va se jouer
        // (accueil + pas de prefers-reduced-motion). Le preloader se rejoue à
        // chaque rafraîchissement de l'accueil ; on fige aussi la restauration
        // de scroll pour repartir du haut sans gâcher l'animation.
        (function () {
            try {
                var home = location.pathname === '/';
                var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (home && !reduced) {
                    document.documentElement.classList.add('preloading');
                    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
                    window.scrollTo(0, 0);
                }
            } catch (e) { /* no-op */ }
        })();
    </script>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

<body class="bg-white text-[#262626] antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
